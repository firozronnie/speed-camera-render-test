name: Render video
on:
  push:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'remotion.config.ts'
      - '.github/workflows/render-video.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-video
  cancel-in-progress: false
jobs:
  render:
    name: Render video
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Render SpeedCameraFull
        run: |
          mkdir -p out
          set -o pipefail
          npx remotion render SpeedCameraFull out/speed-camera-full.mp4 --gl=swangle --codec=h264 --overwrite 2>&1 | tee out/render.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-camera-full.mp4
          path: out/speed-camera-full.mp4
          if-no-files-found: warn
      - name: Commit result back to repo
        if: always()
        run: |
          mkdir -p out
          if [ -f out/speed-camera-full.mp4 ]; then
            echo '{"status":"success"}' > out/render-status.json
          else
            echo '{"status":"failed"}' > out/render-status.json
          fi
          tail -c 6000 out/render.log > out/render-log-tail.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f out/speed-camera-full.mp4 out/render-status.json out/render-log-tail.txt || true
          git commit -m "Render result" || true
          git push || true
